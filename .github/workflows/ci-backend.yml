name: CI Backend

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Testes do backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Obter o código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Instalar Poetry
        run: python -m pip install poetry==2.4.3

      - name: Validar dependências
        working-directory: backend
        run: poetry check --lock

      - name: Instalar dependências de desenvolvimento
        run: make install

      - name: Verificar código com Ruff
        run: make lint

      - name: Verificar formatação com Ruff
        run: make format-check

      - name: Executar Pytest
        run: make test
