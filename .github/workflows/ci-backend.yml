name: CI Backend

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Testes do backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: c216
          POSTGRES_PASSWORD: c216
          POSTGRES_DB: c216_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U c216 -d c216_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://c216:c216@localhost:5432/c216_test

    steps:
      - name: Obter o código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Instalar Poetry
        run: python -m pip install poetry==2.4.3

      - name: Validar dependências
        working-directory: backend
        run: poetry check --lock

      - name: Instalar dependências de desenvolvimento
        run: make install

      - name: Verificar código com Ruff
        run: make lint

      - name: Verificar formatação com Ruff
        run: make format-check

      - name: Executar testes unitarios
        run: make test-unit

      - name: Executar testes de integracao
        run: make test-integration

      - name: Executar todas as suites juntas
        run: make test-all
